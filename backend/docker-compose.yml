version: '3.8'

services:
  poker-score-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poker-score-backend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
